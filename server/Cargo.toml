[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[package]
name = "crabcast-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Crabcast API server — AzuraCast-style radio management backend (axum + SQLite)"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower = { version = "0.5", features = ["util"] }
# Media library: tag read/write + waveform peaks.
lofty = "0.25"
sha2 = "0.10"
symphonia = { version = "0.5", features = ["all"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
tower-sessions = { version = "0.14", features = ["private"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
tower-cookies = "0.11"
time = "0.3"
# Icecast admin XML parsing (listener stats) and disk free-space check.
quick-xml = { version = "0.37", features = ["serialize"] }
libc = "0.2"
# Backup/restore archives (Phase 10): zip snapshot of DB + media + configs.
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio-util = { version = "0.7", features = ["io"] }
# Shared SSE/event bus across API hosts (Phase 9): optional, behind
# CRABCAST_REDIS_URL.
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
criterion = "0.5"

[[bench]]
name = "hot_paths"
harness = false

[profile.release]
lto = true
strip = true
