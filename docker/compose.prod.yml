# Production stack: Crabcast API + web + Icecast.
#
#   docker compose -f docker/compose.prod.yml up -d --build
#
# Secrets come from the environment (or a .env file next to this file):
#   CRABCAST_SESSION_SECRET  ICECAST_SOURCE_PASSWORD  ICECAST_ADMIN_PASSWORD
#   CRABCAST_ALERT_WEBHOOK_URL (optional)
services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    environment:
      DATABASE_URL: sqlite:/data/crabcast.db
      BIND_ADDR: 0.0.0.0:8080
      CRABCAST_DATA_DIR: /data/stations
      CRABCAST_MEDIA_DIR: /media
      CRABCAST_SESSION_SECRET: ${CRABCAST_SESSION_SECRET:?set CRABCAST_SESSION_SECRET}
      CRABCAST_ALERT_WEBHOOK_URL: ${CRABCAST_ALERT_WEBHOOK_URL:-}
      RUST_LOG: crabcast_server=info,tower_http=info
    volumes:
      - server-data:/data
      - media-data:/media
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      API_UPSTREAM: http://server:8080
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  icecast:
    image: moul/icecast2:latest
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_RELAY_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-admin}
      ICECAST_ADMIN_USERNAME: admin
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  server-data:
  media-data:
