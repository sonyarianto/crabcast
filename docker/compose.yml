services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    environment:
      DATABASE_URL: sqlite:/data/crabcast.db
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: crabcast_server=info,tower_http=info
    volumes:
      - server-data:/data
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      API_UPSTREAM: http://server:8080
    ports:
      - "3000:3000"
    depends_on:
      - server

  icecast:
    image: moul/icecast2:latest
    environment:
      ICECAST_SOURCE_PASSWORD: hackme
      ICECAST_RELAY_PASSWORD: hackme
      ICECAST_ADMIN_PASSWORD: admin
      ICECAST_ADMIN_USERNAME: admin
    ports:
      - "8000:8000"

volumes:
  server-data: